spring.application.name=dalaranS
server.port=8081

supabase.url=${SUPABASE_URL:}
supabase.jwt-issuer=${SUPABASE_JWT_ISSUER:}
supabase.db-url=${SUPABASE_DB_URL:}
supabase.db-user=${SUPABASE_DB_USER:}
supabase.db-password=${SUPABASE_DB_PASSWORD:}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_JWT_ISSUER:}

spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/dalarans}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
