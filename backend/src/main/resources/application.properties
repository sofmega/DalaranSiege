spring.application.name=dalaranS
server.port=${PORT:8081}

# Comma-separated browser origins. Override this in Cloud Run with the
# production frontend URL while keeping local development working by default.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4201}

supabase.url=${SUPABASE_URL:}
supabase.jwt-issuer=${SUPABASE_JWT_ISSUER:}
supabase.db-url=${SUPABASE_DB_URL:}
supabase.db-user=${SUPABASE_DB_USER:}
supabase.db-password=${SUPABASE_DB_PASSWORD:}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_JWT_ISSUER:}

spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/dalarans}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.data-source-properties.connectTimeout=${DB_CONNECT_TIMEOUT_SECONDS:10}
spring.datasource.hikari.data-source-properties.socketTimeout=${DB_SOCKET_TIMEOUT_SECONDS:30}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
